  <meta property="og:title" content="Gallery — Trendli9 Prints"><meta property="og:image" content="assets/img/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <span class="blob blob--m" style="opacity:.35"></span>
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Gallery</span></nav>
        <h1>Prints that <span class="grad-text">speak quality</span></h1>
        <p>A look at transfers, garments and fabrics from our studio. Tap any image to view it full-size.</p>
      </div>
    </section>
    <section class="section" style="padding-top:40px">
      <div class="container">
        <div class="filter-chips" id="gChips" role="group" aria-label="Filter gallery" style="margin-bottom:28px"></div>
        <div class="masonry" id="masonry"></div>
      </div>
    </section>
    <section class="section section--tint">
      <div class="container">
        <div class="cta-band">
          <div><h2>See more on <span class="grad-text">Instagram</span></h2><p>New drops and behind-the-scenes every week at @<span class="ig-handle"></span>.</p></div>
          <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn btn--ig ig-link" href="#" target="_blank" rel="noopener"><i data-icon="instagram"></i> Follow us</a><a class="btn btn--ghost-light" href="studio.html">Design yours</a></div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/config.js?v=20261016n"></script>
  <script src="assets/js/catalog.js?v=20261016n"></script>
  <script src="assets/js/icons.js?v=20261016n"></script>
  <script src="assets/js/mockups.js?v=20261016n"></script>
  <script src="assets/js/app.js?v=20261016n"></script>
  <script>
  (function () {
    const { $, $$, esc } = window.T9, CAT = window.T9_CATALOG;
    const cats = [{ id: "all", name: "All" }, ...CAT.CATEGORIES.filter(c => CAT.GALLERY.some(g => g.cat === c.id))];
    $("#gChips").innerHTML = cats.map((c, i) => `<button type="button" class="chip" data-g="${c.id}" aria-pressed="${!i}">${esc(c.name)}</button>`).join("");
    const render = f => { $("#masonry").innerHTML = CAT.GALLERY.filter(g => f === "all" || g.cat === f).map(g => `<figure class="reveal is-in" data-lightbox="gal" data-caption="${esc(g.cap)}" tabindex="0" role="button" aria-label="View ${esc(g.cap)}"><img src="assets/img/${g.img}.webp" alt="${esc(g.cap)}" loading="lazy" width="${g.w}" height="${g.h}"><figcaption>${esc(g.cap)}</figcaption></figure>`).join(""); };
    $("#gChips").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (!b) return; $$("#gChips .chip").forEach(c => c.setAttribute("aria-pressed", c === b)); render(b.dataset.g); });
    render("all");
  })();
  </script>
</body>
